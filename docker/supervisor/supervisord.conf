[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:nginx]
command=/usr/local/bin/nginx-start
autostart=true
autorestart=true
priority=10
stdout_logfile=/app/logs/nginx-stdout.log
stderr_logfile=/app/logs/nginx-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:php-fpm]
command=/bin/sh -lc "/usr/local/bin/weathermap-init && exec /usr/local/sbin/php-fpm -F"
autostart=true
autorestart=true
priority=5
stdout_logfile=/app/logs/php-fpm-stdout.log
stderr_logfile=/app/logs/php-fpm-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; Map recording (Admin > Recording): idle unless maps are recorded
[program:recorder]
command=/usr/local/bin/php /app/bin/record.php
user=www-data
autostart=true
autorestart=true
startsecs=5
priority=20
redirect_stderr=true
stdout_logfile=/app/logs/recorder.log
stdout_logfile_maxbytes=10MB

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_sqlite, mbstring, curl
          coverage: none

      # Fail early on a runner image that still ships a PHP release with a
      # known security hole (8.5.12 fixes CVE-2026-109618 and CVE-2026-109619).
      - name: Check the PHP patch level
        run: |
          php -v
          php -r 'if (version_compare(PHP_VERSION, "8.5.12", "<")) { fwrite(STDERR, "PHP 8.5.12 or later is required\n"); exit(1); }'

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests
        run: vendor/bin/phpunit

      - name: Translation catalogues (informative)
        continue-on-error: true
        run: php src/bin/i18n-check.php --strict

      - name: Keep rendered maps on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-maps-php${{ matrix.php }}
          path: build/test-output

# Testbed: the simulated devices of deploy/testbed (snmpsim/devices.json)
#
# Demo map of the testbed only: it reads the Observium data source that
# seed.php adds, so it is not shipped with the application. The weathermap
# container sets DEMO_MAPS_EXTRA_DIR to this folder, so the Maps page's
# demo button adds it again once deleted.

WIDTH 900
HEIGHT 560
TITLE Testbed
TITLEPOS 10 28

# Background color
BGCOLOR 255 255 255

# Default fonts (fonts 1 to 5 are GD's own, drawn without TrueType)
FONTDEFINE 10 fonts/Inter-Regular.ttf 8
FONTDEFINE 11 fonts/Inter-Regular.ttf 9
FONTDEFINE 12 fonts/Inter-SemiBold.ttf 10
FONTDEFINE 13 fonts/Inter-SemiBold.ttf 12

TITLEFONT 13
TIMEFONT 11
KEYFONT 10

# No timestamp card: the status bar shows the update time, on the map
TIMEPOS -1 -1
SET viewer_panels sites:side total:side updated:map:10,520

# Default scale, smooth: each step fades into the next one
# (0 to 0, the links without traffic, stays a flat grey)
SCALE DEFAULT 0 0     192 192 192
SCALE DEFAULT 0 1     255 255 255  140 0 255
SCALE DEFAULT 1 10    140 0 255    32 32 255
SCALE DEFAULT 10 25   32 32 255    0 192 255
SCALE DEFAULT 25 40   0 192 255    0 240 0
SCALE DEFAULT 40 55   0 240 0      240 240 0
SCALE DEFAULT 55 70   240 240 0    255 192 0
SCALE DEFAULT 70 85   255 192 0    255 0 0
SCALE DEFAULT 85 100  255 0 0

# Map items: the traffic legend card, under the title
SET box_1 legend 10 40

# Default node settings
NODE DEFAULT
    LABELFONT 12
    MAXVALUE 100

# Default link settings
LINK DEFAULT
    BWFONT 11
    COMMENTFONT 10
    BANDWIDTH 100M
    BWLABEL bits
    BWLABELPOS 50 50
    WIDTH 4


NODE internet
    LABEL Internet
    ICON objects/cloud-v2.png
    POSITION 450 90

NODE core-router
    LABEL core-router
    ICON objects/Router.png
    TARGET observium:host:core-router:status
    POSITION 450 250

NODE access-switch-1
    LABEL access-switch-1
    ICON objects/WorkgroupSwitch.png
    TARGET observium:host:access-switch-1:status
    POSITION 230 420

NODE access-switch-2
    LABEL access-switch-2
    ICON objects/WorkgroupSwitch.png
    TARGET observium:host:access-switch-2:status
    POSITION 670 420

LINK core-router-internet
    NODES core-router internet
    TARGET observium:host:core-router:if:xe-0/0/0
    BANDWIDTH auto
    WIDTH auto
    BWLABELPOS 75 25

LINK core-router-access-switch-1
    NODES core-router access-switch-1
    TARGET observium:host:core-router:if:xe-0/0/1
    BANDWIDTH auto
    WIDTH auto
    BWLABELPOS 75 25

LINK core-router-access-switch-2
    NODES core-router access-switch-2
    TARGET observium:host:core-router:if:xe-0/0/2
    BANDWIDTH auto
    WIDTH auto
    BWLABELPOS 75 25

; Zend OPcache: compiled scripts stay in memory for the web interface. The
; code only changes with a new image, so files are never re-checked.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; The poller and discovery start new PHP processes every 5 minutes. A file
; cache in /tmp (a tmpfs, so in RAM) lets them reuse the compiled scripts.
opcache.enable_cli = 1
opcache.file_cache = /tmp/opcache

memory_limit = 512M
session.save_path = /tmp

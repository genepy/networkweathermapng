# Links that nothing feeds (F66, F67): without TARGET they are grey with
# no labels; with a TARGET that gives nothing they are grey with a warning
WIDTH 600
HEIGHT 300
TITLE Links without data
TITLEPOS 10 20
TIMEPOS -1 -1
SET nowarn_clipping 1

LINK DEFAULT
	WIDTH 6
	BANDWIDTH 1G

NODE a
	LABEL a
	POSITION 100 100

NODE b
	LABEL b
	POSITION 500 100

NODE c
	LABEL c
	POSITION 100 240

NODE d
	LABEL d
	POSITION 500 240

LINK fed
	NODES a b
	TARGET static:450M:120M

LINK unfed
	NODES a c

LINK down
	NODES c d
	TARGET missing-file-for-the-test.tab

LINK idle
	NODES b d
	TARGET static:0

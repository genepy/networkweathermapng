# Node looks: a box with the label, a round badge, the icon alone
# (SET node_style icon), and an icon-only node without an icon
WIDTH 500
HEIGHT 200
TITLE Node looks
TITLEPOS 10 20
KEYPOS DEFAULT -1 -1
TIMEPOS 10 190 Rendu de test

NODE box
	LABEL Box node
	ICON src/public/objects/net/router.png
	LABELOFFSET S
	POSITION 70 100
NODE badge
	LABEL Badge node
	ICON src/public/objects/net/router.png
	POSITION 190 100
	SET node_style badge
	SET badge_size 40
NODE icon
	LABEL Icon node
	ICON src/public/objects/net/router.png
	POSITION 310 100
	SET node_style icon
	SET badge_size 40
NODE noicon
	LABEL No icon
	POSITION 430 100
	SET node_style icon

LINK l1
	NODES box badge
	BANDWIDTH 1G
	TARGET static:300M:600M
LINK l2
	NODES badge icon
	BANDWIDTH 1G
	TARGET static:100M:200M
LINK l3
	NODES icon noicon
	BANDWIDTH 1G
	TARGET static:500M:50M

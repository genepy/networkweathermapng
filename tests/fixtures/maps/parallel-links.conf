# Links between the same two nodes are drawn side by side
WIDTH 600
HEIGHT 360
TITLE Parallel links
TITLEPOS 10 20
KEYPOS DEFAULT -1 -1
TIMEPOS 10 350 Rendu de test

LINK DEFAULT
	WIDTH 5
	BANDWIDTH 10G

NODE core
	LABEL core
	POSITION 120 100
NODE edge
	LABEL edge
	POSITION 480 260
NODE lone
	LABEL lone
	POSITION 480 60

LINK core-edge-1
	NODES core edge
	TARGET static:2G:1G
LINK core-edge-2
	NODES core edge
	TARGET static:5G:4G
LINK edge-core-3
	NODES edge core
	TARGET static:9G:8G
LINK core-lone
	NODES core lone
	TARGET static:1G

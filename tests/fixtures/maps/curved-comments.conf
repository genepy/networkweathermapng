# Comments along curved links (COMMENTCURVE 1), with straight fallbacks
WIDTH 600
HEIGHT 400
HTMLSTYLE static
FONTDEFINE 100 src/public/fonts/FiraSans-Regular.ttf 8
KEYPOS DEFAULT -1 -1
TITLE Curved comments
TITLEPOS 200 320
TIMEPOS 420 300 Test render
SET nowarn_clipping 1

LINK DEFAULT
	WIDTH 5
	BANDWIDTH 1G
	COMMENTFONT 100
	COMMENTCURVE 1
	BWLABELPOS 55 45

NODE a
	LABEL a
	POSITION 60 220

NODE b
	LABEL b
	POSITION 520 220

NODE c
	LABEL c
	POSITION 60 380

NODE d
	LABEL d
	POSITION 460 380

NODE e
	LABEL e
	POSITION 575 380

NODE f
	LABEL f
	POSITION 400 40

LINK arch
	NODES a b
	VIA 300 80
	TARGET static:300M:600M
	OUTCOMMENT along the curve, near a
	INCOMMENT never upside down, near b

LINK straight
	NODES c d
	TARGET static:100M
	OUTCOMMENT straight link, straight text
	INCOMMENT back the other way

LINK corner
	NODES e f
	VIA 575 40
	VIASTYLE angled
	TARGET static:10M
	COMMENTPOS 95 45
	OUTCOMMENT too tight at the corner: straight

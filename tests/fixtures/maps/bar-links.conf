# The traffic bar look (SET link_look bar): thick square bars, each half in
# the colour of its direction, a double tick where they meet, no outline
WIDTH 600
HEIGHT 300
TITLE Traffic bars
TITLEPOS 10 20
KEYPOS DEFAULT -1 -1
TIMEPOS 10 290 Rendu de test
BGCOLOR 30 34 40

SET link_look bar

NODE DEFAULT
	SET node_style badge
	SET badge_size 30

LINK DEFAULT
	WIDTH 6
	BWLABEL none

# two loads, two colours, the separator in the middle
NODE a
	LABEL A
	POSITION 70 80
NODE b
	LABEL B
	POSITION 330 80
LINK twoloads
	NODES a b
	BANDWIDTH 1G
	TARGET static:100M:900M

# a slanted bar, its separator in another colour, with an outline
NODE c
	LABEL C
	POSITION 400 70
NODE d
	LABEL D
	POSITION 540 230
LINK slanted
	NODES c d
	BANDWIDTH 1G
	TARGET static:600M:300M
	SET link_bar_separator #000000
	SET link_bar_outline #ffffff

# a one-way bar: no separator
NODE e
	LABEL E
	POSITION 70 170
NODE f
	LABEL F
	POSITION 330 170
LINK oneway
	NODES e f
	ARROWSTYLE classic
	LINKSTYLE oneway
	BANDWIDTH 1G
	TARGET static:500M:50M

# a link that keeps the arrows on a bar map
NODE g
	LABEL G
	POSITION 120 250
NODE h
	LABEL H
	POSITION 330 250
LINK classic
	NODES g h
	BANDWIDTH 1G
	TARGET static:300M:700M
	SET link_look classic

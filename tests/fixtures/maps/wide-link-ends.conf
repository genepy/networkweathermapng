# Links as wide as their nodes or wider (F82): each link stops inside its
# nodes, where most of its end is covered, never at the centre with its
# square corners out past the node
WIDTH 600
HEIGHT 300
TITLE Wide link ends
TITLEPOS 10 20
KEYPOS DEFAULT -1 -1
TIMEPOS 10 290 Rendu de test

# a wide link between two small badges
NODE a
	LABEL A
	ICON src/public/objects/net/router.png
	POSITION 80 80
	SET node_style badge
	SET badge_size 24
NODE b
	LABEL B
	ICON src/public/objects/net/router.png
	POSITION 300 80
	SET node_style badge
	SET badge_size 24
LINK ab
	NODES a b
	WIDTH 16
	BANDWIDTH 1G
	TARGET static:300M:600M

# a wide link from a badge to an icon alone, at an angle
NODE c
	LABEL C
	ICON src/public/objects/net/router.png
	POSITION 420 80
	SET node_style icon
	SET badge_size 24
LINK bc
	NODES b c
	WIDTH 14
	BANDWIDTH 1G
	TARGET static:900M:100M

# a wide link between two small label boxes, through a VIA point
NODE d
	LABEL D
	POSITION 80 220
NODE e
	LABEL E
	POSITION 520 220
LINK de
	NODES d e
	VIA 300 160
	WIDTH 12
	BANDWIDTH 1G
	TARGET static:500M:50M

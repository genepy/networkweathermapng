# The smooth scale of new maps (F57, MapService::generateDefaultConfig()):
# each step fades into the next one, so a link takes the colour of its exact
# load and the legend card is one continuous bar. A hidden card
# (SET box_<id>_hidden 1) is not drawn.
WIDTH 600
HEIGHT 340
TITLE Smooth scale
TITLEPOS 10 20
TIMEPOS 470 30 Rendu de test
BGCOLOR 255 255 255
KEYFONT 2

SCALE DEFAULT 0 0     192 192 192
SCALE DEFAULT 0 1     255 255 255  140 0 255
SCALE DEFAULT 1 10    140 0 255    32 32 255
SCALE DEFAULT 10 25   32 32 255    0 192 255
SCALE DEFAULT 25 40   0 192 255    0 240 0
SCALE DEFAULT 40 55   0 240 0      240 240 0
SCALE DEFAULT 55 70   240 240 0    255 192 0
SCALE DEFAULT 70 85   255 192 0    255 0 0
SCALE DEFAULT 85 100  255 0 0

# the legend card: one bar from 0 to 100 %
SET box_1 legend 10 40
SET box_1_width 300
# a hidden legend over the links: not drawn
SET box_2 legend 200 180
SET box_2_style list
SET box_2_hidden 1

NODE DEFAULT
	LABELFONT 2

LINK DEFAULT
	WIDTH 8
	BANDWIDTH 1G
	BWLABEL none

NODE a
	LABEL a
	POSITION 60 160
NODE b
	LABEL b
	POSITION 540 160
NODE c
	LABEL c
	POSITION 60 225
NODE d
	LABEL d
	POSITION 540 225
NODE e
	LABEL e
	POSITION 60 290
NODE f
	LABEL f
	POSITION 540 290

# 5 % and 17 %: between purple and blue, and blue and cyan
LINK idle
	NODES a b
	TARGET static:50M:170M
# 32 % and 47 %
LINK mid
	NODES c d
	TARGET static:320M:470M
# 62 % and 92 %
LINK busy
	NODES e f
	TARGET static:620M:920M

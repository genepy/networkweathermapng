# Links between nodes of different sizes: the arrows meet in the middle of
# the visible part, each label sits on its own arrow, heads keep their shape
WIDTH 600
HEIGHT 400
TITLE Link ends
TITLEPOS 10 20
KEYPOS DEFAULT -1 -1
TIMEPOS 10 390 Rendu de test

NODE DEFAULT
	SET node_style badge

LINK DEFAULT
	WIDTH 5

# a large badge linked to a small one
NODE big1
	LABEL Big one
	POSITION 90 90
	SET badge_size 120
NODE small1
	LABEL S
	POSITION 520 90
	SET badge_size 20
LINK long
	NODES big1 small1
	BANDWIDTH 1G
	TARGET static:300M:600M

# a short link between a large and a small badge: labels kept apart
NODE big2
	LABEL Big two
	POSITION 90 240
	SET badge_size 90
NODE small2
	LABEL T
	POSITION 220 240
	SET badge_size 20
LINK short
	NODES big2 small2
	BANDWIDTH 1G
	TARGET static:100M:900M

# two badges close together
NODE b3
	LABEL C
	POSITION 330 240
	SET badge_size 40
NODE b4
	LABEL D
	POSITION 420 300
	SET badge_size 40
LINK badges
	NODES b3 b4
	BANDWIDTH 1G
	TARGET static:500M:50M

# a wide link between close nodes: the heads get narrower, not flat
NODE c1
	LABEL E
	POSITION 450 180
	SET badge_size 36
NODE c2
	LABEL F
	POSITION 560 180
	SET badge_size 36
LINK wide
	NODES c1 c2
	WIDTH 12
	BANDWIDTH 1G
	TARGET static:700M

# Map de demonstration utilisee par les tests de rendu
WIDTH 800
HEIGHT 500
TITLE Demo Weathermap
TITLEPOS 10 20
HTMLSTYLE static
KEYPOS DEFAULT 680 20 Trafic
TIMEPOS 10 490 Rendu de test
SET nowarn_clipping 1

LINK DEFAULT
	WIDTH 6
	BANDWIDTH 1G

NODE core
	LABEL core-rtr1
	POSITION 400 120

NODE paris
	LABEL paris-sw1
	POSITION 150 320

NODE lyon
	LABEL lyon-sw1
	POSITION 650 320

NODE backup
	LABEL backup
	POSITION 400 380

LINK core-paris
	NODES core paris
	TARGET static:450M:120M

LINK core-lyon
	NODES core lyon
	TARGET static:900M:30M
	BANDWIDTH 1G

LINK paris-backup
	NODES paris backup
	VIA 250 420
	VIASTYLE curved
	TARGET static:10M

LINK lyon-backup
	NODES lyon backup
	TARGET static:0

# A map saved by PHP Network Weathermap 2.0, written for these tests
WIDTH 800
HEIGHT 500
TITLE Branch offices
SET background_sizing fit
SET traffic_pulse 1

LINK DEFAULT
	COMMENTCURVE 1

NODE note1
	LABEL Maintenance: Sunday 02:00
	SET editor_note 1
	SET editor_note_align left
	SET editor_note_escaped Line one\nLine two
	POSITION 120 60

NODE a
	LABEL Site A
	SET editor_label_position N60
	POSITION 200 250

NODE b
	LABEL Site B
	POSITION 600 250

LINK a-b
	NODES a b
	INCOMMENT in
	OUTCOMMENT out

LINK b-a
	NODES b a
	COMMENTCURVE 0
	VIA 400 400

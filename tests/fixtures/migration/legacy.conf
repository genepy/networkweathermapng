# Old Cacti plugin map
HTMLOUTPUTFILE /var/www/cacti/plugins/weathermap/output/core.html
IMAGEOUTPUTFILE /var/www/cacti/plugins/weathermap/output/core.png
INCLUDE /etc/weathermap/common.conf
WIDTH 600
HEIGHT 400
TITLE Core network
KEYFONT 2
TITLEFONT 3

NODE DEFAULT
	LABELFONT 4

NODE rtr1
	LABEL rtr1
	ICON /var/www/cacti/plugins/weathermap/images/Router.png
	POSITION 100 100

NODE sw1
	LABEL sw1
	ICON images/not-there.png
	POSITION 400 100

NODE sw2
	LABEL sw2
	POSITION 400 300

LINK DEFAULT
	BWFONT 2
	BANDWIDTH 1G

LINK rtr1-sw1
	TARGET /opt/observium/rrd/core-rtr1/port-3.rrd
	NODES rtr1 sw1
	VIA 250 60

LINK rtr1-sw2
	TARGET -snmp:public:core-rtr1.example.net:.1.3.6.1.2.1.2.2.1.10.7:.1.3.6.1.2.1.2.2.1.16.7
	NODES rtr1 sw2

LINK sw1-sw2
	TARGET "!/usr/local/bin/get-traffic.sh sw1"
	NODES sw1 sw2

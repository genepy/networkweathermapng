<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"><title>Cooling tower (animated)</title><style>@media (prefers-reduced-motion:no-preference){.wm-r{animation:wm-spin 1.4s linear infinite}.wm-p{animation:wm-rise 2.4s ease-out infinite}.wm-p2{animation-delay:-1.2s}}.wm-r{transform-box:fill-box;transform-origin:center}@keyframes wm-spin{to{transform:rotate(360deg)}}@keyframes wm-rise{from{transform:translateY(4px);opacity:.9}to{transform:translateY(-6px);opacity:0}}</style><g fill="#c9d6e3"><circle class="wm-p" cx="26" cy="9" r="4" opacity=".7"/><circle class="wm-p wm-p2" cx="36" cy="8" r="4.5" opacity=".7"/></g><rect x="16" y="13" width="32" height="6" rx="1.5" fill="#8c959f" stroke="#3b4a5c" stroke-width="1.5"/><path d="M14 19h36l5 40H9z" fill="#dbe3ec" stroke="#3b4a5c" stroke-width="2" stroke-linejoin="round"/><circle cx="32" cy="34" r="10" fill="#1f2a37" stroke="#3b4a5c" stroke-width="1.5"/><g transform="translate(32 34)"><g class="wm-r" fill="#7cc4ff"><path d="M0 0c-3-3-3-7 0-8c3 1 3 5 0 8z"/><path d="M0 0c-3-3-3-7 0-8c3 1 3 5 0 8z" transform="rotate(90)"/><path d="M0 0c-3-3-3-7 0-8c3 1 3 5 0 8z" transform="rotate(180)"/><path d="M0 0c-3-3-3-7 0-8c3 1 3 5 0 8z" transform="rotate(270)"/></g></g><circle cx="32" cy="34" r="2" fill="#e6edf3"/><path d="M13 49h38M12 54h40" stroke="#2f8fd8" stroke-width="1.8" stroke-dasharray="3 2"/></svg>

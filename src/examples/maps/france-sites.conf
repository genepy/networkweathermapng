# France: regional network with several sites in some cities
#
# Demo map of NetworkWeathermapNG. It floats on a geographic basemap: every
# node is placed by latitude and longitude (SET geo), so the cities with
# several sites (Paris, Lyon, Marseille, Toulouse) merge into a numbered
# cluster in the viewer until you zoom in, and hovering one shows the city
# in the inset map. SET site groups the nodes by city in the side panel.
# Traffic comes from the static data source (TARGET static:<in>:<out>), so
# the map draws without Zabbix or Observium.

WIDTH 1000
HEIGHT 900
TITLE France sites
BGCOLOR 246 247 249
HTMLSTYLE overlib

FONTDEFINE 100 fonts/FiraSans-Regular.ttf 9
FONTDEFINE 101 fonts/FiraSans-SemiBold.ttf 10
FONTDEFINE 102 fonts/FiraSans-SemiBold.ttf 15

TITLEFONT 102
TITLEPOS 24 874
TITLECOLOR 33 37 41
TIMEFONT 100
TIMEPOS 880 874 Updated %H:%M
SET timestamp_style pill

KEYFONT 100
KEYPOS DEFAULT 740 780 Link load
KEYSTYLE DEFAULT modern 220
KEYBGCOLOR 255 255 255
KEYOUTLINECOLOR 205 211 219
KEYTEXTCOLOR 33 37 41

# Colour-blind safe link scale
SCALE DEFAULT 0 0     160 166 175
SCALE DEFAULT 0 1     200 205 212
SCALE DEFAULT 1 10    189 215 238
SCALE DEFAULT 10 25   107 174 214
SCALE DEFAULT 25 40   49 130 189
SCALE DEFAULT 40 55   116 196 118
SCALE DEFAULT 55 70   254 196 79
SCALE DEFAULT 70 85   253 141 60
SCALE DEFAULT 85 100  215 48 39

# Geographic basemap (OpenFreeMap vector tiles, OpenStreetMap data)
SET basemap https://tiles.openfreemap.org/styles/positron
SET basemap_dark https://tiles.openfreemap.org/styles/dark
SET basemap_center 46.45 2.6
SET basemap_zoom 5.4

# Viewer effects: comets along the links, saturated links pulse
SET link_flow 1
SET traffic_pulse 1
SET width_legend 20 600
SET width_legend_title Link speed

# Nodes are round badges: the icon, or the initials of the label
NODE DEFAULT
	LABELFONT 101
	LABELBGCOLOR 255 255 255
	LABELOUTLINECOLOR 49 130 189
	LABELFONTCOLOR 33 37 41
	SET node_style badge

LINK DEFAULT
	BANDWIDTH 10G
	WIDTH auto
	INBWFORMAT {link:this:inpercent:%.0f}%
	OUTBWFORMAT {link:this:outpercent:%.0f}%
	BWSTYLE pill
	BWFONT 100
	BWLABELPOS 50 50
	OUTLINECOLOR 255 255 255

NODE demo-note
	POSITION 860 470
	LABEL Demo map\nStatic traffic values (TARGET static:in:out)\nZoom on Paris, Lyon or Marseille to split their sites
	LABELFONT 100
	LABELBGCOLOR 255 255 255
	LABELOUTLINECOLOR 205 211 219
	LABELFONTCOLOR 73 80 87
	SET editor_note 1
	SET editor_note_escaped 1
	SET editor_note_align left


# Datacenter cooling: cooling towers, chillers, groundwater free cooling,
# chilled water loops A and B, and the CRAH units of three IT rooms
#
# Demo map of NetworkWeathermapNG. It reads a cooling plant like a network:
# each link is a pipe (or the air of a CRAH unit) and its value is the load
# of that pipe in % of its design flow, both directions (supply and return).
# Values come from the static data source (TARGET static:<in>:<out>), so the
# map draws without Zabbix or Observium; with a real plant, point the links
# at the flow meters of a BMS exported to your monitoring.
#
# Every part is redundant: two chilled water loops (A and B) feed each room
# through its own CRAH unit, three chillers run N+1 (chiller 3 on standby),
# and two well pumps draw groundwater for free cooling through a plate heat
# exchanger, then return it to the aquifer through a reinjection well.
# Temperature probes (nodes with the thermometer icon) show the water and
# air temperatures at the points that matter.
#
# The pumps, chillers, cooling towers and CRAH units use the animated icons
# of objects/animated/: they move in the live view and the kiosk, and stay
# still in the editor, in the PNG and for visitors who asked for less motion.


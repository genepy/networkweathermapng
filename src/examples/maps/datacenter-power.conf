# Datacenter power: two utility feeds, generators, transformers, main low
# voltage switchboards, UPS and the A and B power paths of three IT rooms
#
# Demo map of NetworkWeathermapNG. It reads a power chain like a network:
# each link is a feeder, drawn one way (where the power goes), and its value
# is the load of that feeder in % of its rating. Values come from the
# static data source (TARGET static:<in>:<out>), so the map draws without
# Zabbix or Observium; with a real site, point the links at the meters of
# your switchboards, UPS and PDUs.
#
# Everything is doubled: path A and path B each have their own utility
# feed (20 kV), transformer, two generators, main low voltage switchboard
# and UPS, and every rack is fed by one PDU on each path. The scene: utility
# feed B is lost, so its generators carry path B while path A stays on the
# grid. The cooling plant takes power from both switchboards, without UPS.
#
# The generators and the UPS use the animated icons of objects/animated/:
# they move in the live view and the kiosk, and stay still in the editor,
# in the PNG and for visitors who asked for less motion.

WIDTH 1400
HEIGHT 1010
TITLE Datacenter power
BGCOLOR 249 250 251
HTMLSTYLE overlib

# One font for the whole map: Inter, shipped in public/fonts
FONTDEFINE 100 fonts/Inter-Regular.ttf 9
FONTDEFINE 101 fonts/Inter-SemiBold.ttf 10
FONTDEFINE 102 fonts/Inter-SemiBold.ttf 16
FONTDEFINE 103 fonts/Inter-SemiBold.ttf 11

TITLEFONT 102
TITLEPOS 24 980
TITLECOLOR 33 37 41
TIMEFONT 100
TIMEPOS -1 -1
# No total traffic panel: the values are loads in %, not traffic
SET viewer_panels sites:side total:side:hidden updated:map:440,962

KEYFONT 100
SET box_1 legend 1170 926
SET box_1_title Feeder load (% of rating)
SET box_1_width 200
KEYBGCOLOR 255 255 255
KEYOUTLINECOLOR 205 211 219
KEYTEXTCOLOR 33 37 41

# Idle grey, then green while there is headroom, amber, and red near the rating
SCALE DEFAULT 0 0     160 166 175
SCALE DEFAULT 0 40    150 210 150  50 170 80
SCALE DEFAULT 40 60   50 170 80    150 190 40
SCALE DEFAULT 60 75   150 190 40   240 190 0
SCALE DEFAULT 75 90   240 190 0    240 110 0
SCALE DEFAULT 90 100  240 110 0    230 40 30
SET key_hidezero_DEFAULT 1

SET link_flow 1
SET traffic_pulse 1

NODE DEFAULT
	LABELFONT 101
	LABELOFFSET S
	LABELBGCOLOR 255 255 255
	LABELOUTLINECOLOR 222 226 230
	LABELFONTCOLOR 33 37 41

# Power goes one way: one arrow per feeder, its load beside it
LINK DEFAULT
	BANDWIDTH 100
	WIDTH 5
	LINKSTYLE oneway
	ARROWSTYLE compact
	BWFONT 100
	BWSTYLE pill
	BWBOXCOLOR 255 255 255
	BWOUTLINECOLOR 205 211 219
	BWFONTCOLOR 33 37 41
	OUTBWFORMAT {link:this:outpercent:%.0f}%


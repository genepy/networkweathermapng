	SIZE 460 300
	LABEL Paris POP
	LABELPOS NE
	LABELFONT 103
	FILLCOLOR 26 30 38
	OUTLINECOLOR 74 79 92
	OUTLINESTYLE dashed
	LABELFONTCOLOR 201 162 74


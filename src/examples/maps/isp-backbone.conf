# ISP backbone: core, transit and peering, in the Night theme
#
# Demo map of NetworkWeathermapNG. It uses the colours of the Night theme
# (Map properties > Theme): dark canvas, links that fade from cream to
# amber to red as the load grows, and a glow on them. The links are drawn
# as traffic bars (SET link_look bar): each half in the colour of its
# direction, with a double tick where they meet, and a pill on each half
# with an arrow toward where the traffic goes. Comets run along the links
# in the viewer and the saturated ones pulse. Each point of presence is a
# zone, and SET site groups its routers in the side panel. The transit and
# peering links are link groups (SET traffic_group): the total traffic card
# and the side panel have a tab for each. Two focus areas put Paris or the
# south forward in the viewer. Traffic comes from the static data source
# (TARGET static:<in>:<out>), so the map draws without Zabbix or Observium.

WIDTH 1500
HEIGHT 900
TITLE ISP backbone
BGCOLOR 17 20 26
HTMLSTYLE overlib

# One font for the whole map: Barlow Semi Condensed, narrow enough for the
# pills on the short links (shipped in public/fonts)
FONTDEFINE 100 fonts/BarlowSemiCondensed-Regular.ttf 10
FONTDEFINE 101 fonts/BarlowSemiCondensed-SemiBold.ttf 11
FONTDEFINE 102 fonts/BarlowSemiCondensed-SemiBold.ttf 18
FONTDEFINE 103 fonts/BarlowSemiCondensed-SemiBold.ttf 12

TITLEFONT 102
TITLEPOS 24 880
TITLECOLOR 243 231 201
TIMEFONT 100
TIMECOLOR 184 173 149

# No timestamp: the status bar has the update time, here on the map
TIMEPOS -1 -1
SET viewer_panels sites:side total:side updated:map:1290,820

KEYFONT 100
# Map items: cards in the legend colours (KEYFONT, KEY*COLOR): the total
# traffic with its last 24 hours, the load as a gradient bar and the link
# widths by speed
SET box_1 total 1290 30
SET box_1_style graph
SET box_1_width 180
SET box_2 legend 1290 250
SET box_2_title Link load
SET box_2_width 180
SET box_3 speed 1290 340
SET box_3_title Link speed
KEYTEXTCOLOR 243 231 201
KEYBGCOLOR 26 30 38
KEYOUTLINECOLOR 201 162 74

# Night theme scale: cream to amber to red, smooth (0 to 0, idle, stays grey)
SCALE DEFAULT 0 0     93 100 114
SCALE DEFAULT 0 30    239 231 210  244 199 109
SCALE DEFAULT 30 60   244 199 109  242 153 44
SCALE DEFAULT 60 100  242 153 44   229 83 28
SET key_hidezero_DEFAULT 1

SET link_glow 1
SET link_flow 1
SET traffic_pulse 1
SET link_look bar
SET link_bar_separator #11141a
SET link_width_table 10G:4 100G:8 400G:12

# Focus areas: the viewer's focus button (and #a=<id> in the address) puts
# one forward, the rest of the map dimmed; SET focus_default would open the
# map and the kiosk on one
SET focus_1 110 30 560 450
SET focus_1_title Paris PoP
SET focus_2 180 540 960 830
SET focus_2_title South
SET focus_2_style dim


# ISP backbone: core, transit and peering, in the Night theme
#
# Demo map of NetworkWeathermapNG. It uses the colours of the Night theme
# (Map properties > Theme): dark canvas, links from cream to amber as the
# load grows, labels on pills with an arrow toward where the traffic goes,
# a glow on the links and comets running along them in the viewer. Each
# point of presence is a zone, and SET site groups its routers in the side
# panel. Long-haul links curve, with their comments along the curve.
# Traffic comes from the static data source (TARGET static:<in>:<out>), so
# the map draws without Zabbix or Observium.

WIDTH 1300
HEIGHT 900
TITLE ISP backbone
BGCOLOR 17 20 26
HTMLSTYLE overlib

FONTDEFINE 100 fonts/FiraSans-Regular.ttf 9
FONTDEFINE 101 fonts/FiraSans-SemiBold.ttf 10
FONTDEFINE 102 fonts/FiraSans-SemiBold.ttf 16
FONTDEFINE 103 fonts/FiraSans-SemiBold.ttf 11

TITLEFONT 102
TITLEPOS 24 876
TITLECOLOR 243 231 201
TIMEFONT 100
TIMEPOS 1180 876 Updated %H:%M
TIMECOLOR 184 173 149
SET timestamp_style pill

KEYFONT 100
KEYPOS DEFAULT 1010 600 Link load
KEYSTYLE DEFAULT modern 240
KEYTEXTCOLOR 243 231 201
KEYBGCOLOR 26 30 38
KEYOUTLINECOLOR 201 162 74

# Night theme scale: cream to amber
SCALE DEFAULT 0 0     93 100 114
SCALE DEFAULT 0 1     125 131 145
SCALE DEFAULT 1 10    239 231 210
SCALE DEFAULT 10 25   242 219 163
SCALE DEFAULT 25 40   244 199 109
SCALE DEFAULT 40 55   245 178 70
SCALE DEFAULT 55 70   242 153 44
SCALE DEFAULT 70 85   236 122 31
SCALE DEFAULT 85 100  229 83 28

SET link_glow 1
SET link_flow 1
SET traffic_pulse 1
SET link_width_table 10G:2 100G:4 400G:7
SET width_legend 1010 700
SET width_legend_title Link speed

NODE DEFAULT
	LABELFONT 101
	LABELOFFSET S
	LABELBGCOLOR 26 30 38
	LABELFONTCOLOR 243 231 201
	LABELOUTLINECOLOR 201 162 74

LINK DEFAULT
	BANDWIDTH 100G
	WIDTH auto
	INBWFORMAT {link:this:inpercent:%.0f}%
	OUTBWFORMAT {link:this:outpercent:%.0f}%
	BWSTYLE pill
	BWFONT 100
	BWLABELPOS 68 32
	BWBOXCOLOR 26 30 38
	BWFONTCOLOR 243 231 201
	BWOUTLINECOLOR 74 79 92
	OUTLINECOLOR none
	COMMENTFONT 100
	COMMENTFONTCOLOR 184 173 149
	COMMENTCURVE 1


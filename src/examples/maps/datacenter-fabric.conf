# Datacenter fabric: leaf and spine, with border routers and racks
#
# Demo map of NetworkWeathermapNG. The icons are vector drawings (an .svg
# next to each .png in objects/), so they stay sharp when zooming in the
# viewer and the editor. Zones draw the layers and the racks; every leaf
# reaches every spine over 100G. Traffic comes from the static data source
# (TARGET static:<in>:<out>), so the map draws without Zabbix or Observium.

WIDTH 1200
HEIGHT 860
TITLE Datacenter fabric
BGCOLOR 250 251 252
HTMLSTYLE overlib

FONTDEFINE 100 fonts/FiraSans-Regular.ttf 9
FONTDEFINE 101 fonts/FiraSans-SemiBold.ttf 10
FONTDEFINE 102 fonts/FiraSans-SemiBold.ttf 15
FONTDEFINE 103 fonts/FiraSans-SemiBold.ttf 11

TITLEFONT 102
TITLEPOS 24 836
TITLECOLOR 33 37 41
TIMEFONT 100
TIMEPOS 1080 836 Updated %H:%M
SET timestamp_style pill

KEYFONT 100
KEYPOS DEFAULT 20 20 Link load
KEYSTYLE DEFAULT modern 200
KEYBGCOLOR 255 255 255
KEYOUTLINECOLOR 205 211 219
KEYTEXTCOLOR 33 37 41

SCALE DEFAULT 0 0     160 166 175
SCALE DEFAULT 0 1     200 205 212
SCALE DEFAULT 1 10    140 0 255
SCALE DEFAULT 10 25   32 32 255
SCALE DEFAULT 25 40   0 192 255
SCALE DEFAULT 40 55   0 200 0
SCALE DEFAULT 55 70   230 210 0
SCALE DEFAULT 70 85   255 160 0
SCALE DEFAULT 85 100  230 0 0

SET link_flow 1
SET traffic_pulse 1
SET link_width_table 10G:2 25G:3 100G:4

NODE DEFAULT
	LABELFONT 101
	LABELOFFSET S
	LABELBGCOLOR 255 255 255
	LABELOUTLINECOLOR 222 226 230
	LABELFONTCOLOR 33 37 41

LINK DEFAULT
	BANDWIDTH 100G
	WIDTH auto
	BWLABEL none
	BWFONT 100
	BWSTYLE pill
	BWLABELPOS 50 50
	COMMENTFONT 100
	COMMENTCURVE 1
	COMMENTFONTCOLOR 73 80 87

ZONE border
	POSITION 300 120
	SIZE 600 130
	LABEL Border
	LABELPOS NW
	LABELFONT 103
	FILLCOLOR 255 243 224
	OUTLINECOLOR 230 160 60
	OUTLINESTYLE dashed
	LABELFONTCOLOR 150 90 0
	SHAPE rounded
	RADIUS 14

ZONE spines
	POSITION 140 300
	SIZE 920 130
	LABEL Spine layer
	LABELPOS NW
	LABELFONT 103
	FILLCOLOR 232 240 254
	OUTLINECOLOR 120 150 210
	OUTLINESTYLE dashed
	LABELFONTCOLOR 40 70 140
	SHAPE rounded
	RADIUS 14

ZONE rack-a
	POSITION 80 500
	SIZE 320 300
	LABEL Rack A: compute
	LABELPOS SW
	LABELFONT 103
	FILLCOLOR 236 247 238
	OUTLINECOLOR 110 170 120
	OUTLINESTYLE dashed
	LABELFONTCOLOR 30 100 50
	SHAPE rounded
	RADIUS 14

ZONE rack-b
	POSITION 440 500
	SIZE 320 300
	LABEL Rack B: storage
	LABELPOS SW
	LABELFONT 103
	FILLCOLOR 236 247 238
	OUTLINECOLOR 110 170 120
	OUTLINESTYLE dashed
	LABELFONTCOLOR 30 100 50
	SHAPE rounded
	RADIUS 14

ZONE rack-c
	POSITION 800 500
	SIZE 320 300
	LABEL Rack C: services
	LABELPOS SW
	LABELFONT 103
	FILLCOLOR 236 247 238
	OUTLINECOLOR 110 170 120
	OUTLINESTYLE dashed
	LABELFONTCOLOR 30 100 50
	SHAPE rounded
	RADIUS 14

NODE demo-note
	POSITION 1060 60
	LABEL Demo map\nStatic traffic values (TARGET static:in:out)\nEvery leaf has a 100G uplink to every spine
	LABELFONT 100
	LABELBGCOLOR 255 255 255
	LABELOUTLINECOLOR 205 211 219
	LABELFONTCOLOR 73 80 87
	SET editor_note 1
	SET editor_note_escaped 1
	SET editor_note_align left

